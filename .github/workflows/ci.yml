name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same PR cancels whatever CI run was still going for the
# previous one — no point burning minutes on a commit that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @tanstack/react-start requires >=22.12.0 — must match here.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  backend-ci:
    name: backend · pint · pest
    runs-on: ubuntu-latest
    # Só o Postgres — os testes correm com CACHE_STORE=array,
    # QUEUE_CONNECTION=sync, SESSION_DRIVER=array (ver backend/phpunit.xml),
    # a mesma combinação já usada localmente numa máquina sem a extensão
    # redis do PHP. Porta/nome/credenciais da BD batem com o que
    # phpunit.xml já espera — nada a configurar entre os dois.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: luku_test
          POSTGRES_USER: luku
          POSTGRES_PASSWORD: luku
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U luku"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, mbstring, zip, gd
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Chave/config de dev já vêm preenchidas no próprio .env.example (não
      # é segredo nenhum, é o placeholder de sempre) — chega para os
      # testes, que nunca enviam email/upload real (Mail::fake()/
      # Storage::fake() em cada teste que precisa).
      - run: cp .env.example .env

      - name: Pint (estilo de código)
        run: php vendor/bin/pint --test

      - name: Pest
        run: php vendor/bin/pest

  lighthouse:
    name: lighthouse · a11y + perf budget
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Corre o Lighthouse contra o dev server. As categorias independentes
      # do build (acessibilidade, SEO, boas práticas) são orçamento a sério;
      # a de performance fica em `warn` porque o dev build não é minificado —
      # é um detetor de regressões grosseiras até haver um alvo de preview.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
