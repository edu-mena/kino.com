name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to the same PR cancels whatever CI run was still going for the
# previous one — no point burning minutes on a commit that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @tanstack/react-start requires >=22.12.0 — must match here.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  lighthouse:
    name: lighthouse · a11y + perf budget
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Corre o Lighthouse contra o dev server. As categorias independentes
      # do build (acessibilidade, SEO, boas práticas) são orçamento a sério;
      # a de performance fica em `warn` porque o dev build não é minificado —
      # é um detetor de regressões grosseiras até haver um alvo de preview.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
