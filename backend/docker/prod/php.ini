; Endurecimento de produção (ver auditoria de segurança, Fase 0) — carregado
; depois dos defaults da imagem oficial (prefixo zz- no Dockerfile.prod).

; Sem cabeçalho "X-Powered-By: PHP/8.3.x" — não oferece a versão exata a quem
; procura CVEs conhecidos para ela.
expose_php = Off

; Erros nunca vão para a resposta HTTP (o Laravel já trata disto com
; APP_DEBUG=false; isto cobre erros fatais antes do framework arrancar).
display_errors = Off
display_startup_errors = Off
log_errors = On
