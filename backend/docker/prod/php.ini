; Endurecimento de produção (ver auditoria de segurança, Fase 0) — carregado
; depois dos defaults da imagem oficial (prefixo zz- no Dockerfile.prod).

; Sem cabeçalho "X-Powered-By: PHP/8.3.x" — não oferece a versão exata a quem
; procura CVEs conhecidos para ela.
expose_php = Off

; Erros nunca vão para a resposta HTTP (o Laravel já trata disto com
; APP_DEBUG=false; isto cobre erros fatais antes do framework arrancar).
display_errors = Off
display_startup_errors = Off
log_errors = On

; OPcache explícito para o php-fpm: o código dentro da imagem nunca muda
; depois do build, por isso não há razão para o PHP verificar a data de cada
; ficheiro a cada pedido (validate_timestamps=0). Consequência: depois de
; mexer em ficheiros com a máquina a correr (ex.: `php artisan config:cache`
; via ssh), é preciso reiniciar o php-fpm para o OPcache os voltar a ler.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Cache de caminhos resolvidos — o Laravel faz milhares de include/require
; por pedido.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
