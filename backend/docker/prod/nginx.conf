server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 50m;

    # Respostas comprimidas — o JSON das listagens/catálogo é texto muito
    # repetitivo (~80% menos bytes), e em rede móvel cada KB conta.
    # `gzip_proxied any`: todos os pedidos chegam pela proxy do Fly, e sem
    # isto o nginx não comprime pedidos que vêm de proxies.
    # BREACH (compressão + segredo + texto do atacante na mesma resposta) não
    # se aplica: a API autentica por token Bearer, não por cookie — um site
    # de terceiros não consegue fazer o browser da vítima enviar pedidos
    # autenticados.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/plain text/css application/javascript;

    # Cabeçalhos de segurança (auditoria, Fase 0/5). A API só devolve JSON
    # (mais a página HTML do link "bloquear IP") — nada disto precisa de ser
    # embebido num iframe nem interpretado com outro content-type. `always`
    # para também valerem nas respostas de erro (4xx/5xx).
    server_tokens off;
    fastcgi_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
