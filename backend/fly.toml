# fly.toml app configuration file generated for luku-api on 2026-09-19T12:52:37+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'luku-api'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile.prod'

[deploy]
  release_command = 'php artisan migrate --force'

[processes]
  app = 'supervisord -c /etc/supervisor/conf.d/supervisord.conf'
  reverb = 'php artisan reverb:start --host=0.0.0.0 --port=8081'
  scheduler = 'sh -c "while true; do php artisan schedule:run; sleep 60; done"'
  worker = 'php artisan horizon'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Expõe o processo `reverb` publicamente, numa porta própria (6001) — o
# `[http_service]` acima só cobre o processo `app`, então o browser nunca
# conseguia abrir o WebSocket do Reverb (falhava a ligar a api.luku.ao,
# que só respondia como o Laravel normal). O backend continua a publicar
# eventos NO Reverb pela rede privada do Fly (REVERB_HOST=reverb.process.
# luku-api.internal), nunca por aqui — esta porta é só para o browser.
[[services]]
  internal_port = 8081
  protocol = 'tcp'
  processes = ['reverb']
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 6001
    handlers = ['tls', 'http']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['worker']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['reverb']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['scheduler']
