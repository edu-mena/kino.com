services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks: [luku]

    nginx:
        image: nginx:1.27-alpine
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [app]
        networks: [luku]

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-luku}
            POSTGRES_USER: ${DB_USERNAME:-luku}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-luku}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5433:5432" # 5433 no host para não colidir com um Postgres local (ex: 5432 já ocupado)
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-luku}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks: [luku]

    redis:
        image: redis:7-alpine
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        networks: [luku]

    # WebSocket (notificações real-time) — ver plano, secção "Notificações real-time".
    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        volumes:
            - .:/var/www/html
        env_file: .env
        ports:
            - "8080:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks: [luku]

    # Worker de filas Redis (media/notifications/mail/maintenance) + dashboard.
    horizon:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan horizon
        volumes:
            - .:/var/www/html
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks: [luku]

    # Scheduler (ExpireStoriesJob, recalculo de trending/agregados, limpeza de
    # idempotency_keys) — roda `schedule:run` a cada minuto, deixa o Laravel
    # decidir o que de facto precisa correr em cada tick.
    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
        volumes:
            - .:/var/www/html
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
        networks: [luku]

    # Captura de emails em dev (reset de senha, convite de staff, aprovação de
    # parceiro) — UI em http://localhost:8025.
    mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
            - "8025:8025"
            - "1025:1025"
        networks: [luku]

networks:
    luku:

volumes:
    postgres_data:
    redis_data:
