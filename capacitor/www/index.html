<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Kino — modo de teste</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #faf7f5;
        color: #1c1a19;
        font:
          15px/1.6 -apple-system,
          "Segoe UI",
          Roboto,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.4rem 0;
        color: #6c645e;
      }
      code {
        display: block;
        margin: 1rem 0;
        padding: 0.8rem 1rem;
        background: #fff;
        border: 1px solid #e6ded8;
        border-radius: 8px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.8rem;
        word-break: break-all;
        text-align: left;
      }
      .dot {
        color: #c11e46;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kino<span class="dot">.</span></h1>
      <p><strong>Servidor não configurado.</strong></p>
      <p>Esta app carrega um servidor a correr. Define o endereço e volta a sincronizar:</p>
      <code>CAP_SERVER_URL=http://SEU_IP:PORTA npx cap sync android</code>
      <p>
        O <code style="display: inline; padding: 0.1rem 0.3rem; margin: 0">SEU_IP</code> é o da
        máquina na rede local; a porta é a que o
        <code style="display: inline; padding: 0.1rem 0.3rem; margin: 0">npm run dev</code> imprime.
      </p>
      <p>Detalhes em <strong>capacitor/README.md</strong>.</p>
    </main>
  </body>
</html>
